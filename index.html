<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SaniStock</title>
<!-- Icône SaniStock pour téléphone -->
<link rel="icon" type="image/png" href="https://raw.githubusercontent.com/atv37420/SaniStock/main/0.png">
<link rel="shortcut icon" type="image/png" href="https://raw.githubusercontent.com/atv37420/SaniStock/main/0.png">
<link rel="apple-touch-icon" href="https://raw.githubusercontent.com/atv37420/SaniStock/main/0.png">
<link rel="apple-touch-icon" sizes="180x180" href="https://raw.githubusercontent.com/atv37420/SaniStock/main/0.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="SaniStock">
<meta name="theme-color" content="#0757a0">

<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;height:100%;min-height:100%;overflow-x:hidden;background:#000;font-family:Arial,sans-serif}
body{display:block}
#app{width:100%;max-width:none;min-height:100vh;background:#000}
.screen{display:none;width:100%0;min-height:100vh}
.screen.active{display:block}

/* PAGE D'ACCUEIL PLEIN ÉCRAN */
.home{position:relative;width:100%;height:100vh;height:100dvh;overflow:hidden;background:#000}
.home img{position:absolute;inset:0;display:block;width:100%;height:100%;object-fit:cover;object-position:center center}
.clickZone{position:absolute;left:20%;width:60%;border:0;background:transparent;padding:0;cursor:pointer;z-index:10;touch-action:manipulation}
.stockZone{top:34.0%;height:8.5%}
.disZone{top:44.0%;height:8.5%}
.page{padding:20px;background:#edf5fa}
.back{border:0;border-radius:12px;padding:11px 15px;background:#0758a5;color:#fff;font-weight:900;cursor:pointer}
.page h1{text-align:center;color:#073f91;margin-top:45px}
.card{background:#fff;border-radius:20px;padding:28px;text-align:center;color:#486783;box-shadow:0 8px 25px rgba(0,45,90,.12)}
.stockPage{position:relative;padding:18px;color:#173f68;background:#dceaf4;overflow:hidden}
</style>
</head>
<body>
<div id="app">
  <div style="color:white; padding:20px; text-align:center;">
    <h1>SaniStock</h1>
    <div id="zone-affichage-stock" style="margin-top:20px; text-align:left;">
      <p>Chargement du stock depuis Google Sheets...</p>
    </div>
  </div>
</div>

<script>
  // Votre URL Apps Script officielle
  const URL_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbxz5dZkT7FyFx8ohxWmg2Pt23Yqx0LQDMqqJg8LM8bkfN3ulkb37VqUO8m8WvjyuGBqrg/exec";

  // Fonction pour appeler vos actions du script Google (ex: getStockData)
  function appelerApiSaniStock(action, callbackNom, callbackSucces) {
    const nomFonctionGlobal = "cb_" + Math.random().toString(36).substring(2, 9);
    
    window[nomFonctionGlobal] = function(reponse) {
      delete window[nomFonctionGlobal];
      const scriptElement = document.getElementById(nomFonctionGlobal);
      if (scriptElement) scriptElement.remove();
      
      if (reponse && reponse.success) {
        callbackSucces(reponse.data);
      } else {
        console.error("Erreur API SaniStock :", reponse ? reponse.error : "Réponse vide");
      }
    };

    const script = document.createElement('script');
    script.id = nomFonctionGlobal;
    script.src = `${URL_APPS_SCRIPT}?api=1&action=${action}&callback=${nomFonctionGlobal}`;
    script.onerror = function() {
      console.error("Erreur de chargement du script pour l'action :", action);
    };
    
    document.body.appendChild(script);
  }

  // Chargement du stock au démarrage
  window.addEventListener("DOMContentLoaded", () => {
    appelerApiSaniStock('getStockData', 'traiterStock', function(dataStock) {
      console.log("Stock récupéré :", dataStock);
      const conteneur = document.getElementById("zone-affichage-stock");
      
      if (conteneur && Array.isArray(dataStock)) {
        let html = "<h3 style='color:#fff;'>Mon Stock :</h3><table border='1' style='width:100%; color:#fff; border-collapse:collapse; background:#111;'>";
        html += "<tr><th>Produit</th><th>Actuel</th><th>Statut</th></tr>";
        
        dataStock.forEach(item => {
          html += `<tr>
            <td style='padding:8px; border:1px solid #444;'>${item.produit || ''}</td>
            <td style='padding:8px; border:1px solid #444; text-align:center;'>${item.actuel || 0}</td>
            <td style='padding:8px; border:1px solid #444; text-align:center;'>${item.statut || ''}</td>
          </tr>`;
        });
        html += "</table>";
        conteneur.innerHTML = html;
      }
    });
  });
</script>
</body>
</html>
