<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SaniStock - Test</title>
<style>
  body { font-family: Arial, sans-serif; background: #0758a5; color: white; text-align: center; padding: 40px; margin: 0; }
  .card { background: white; color: #333; padding: 20px; border-radius: 15px; margin-top: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
  button { background: #073f91; color: white; border: none; padding: 15px 25px; font-size: 16px; border-radius: 10px; cursor: pointer; margin-top: 15px; font-weight: bold; }
  button:active { background: #052a63; }
</style>
</head>
<body>

  <h1>SaniStock</h1>
  <p>Mode de diagnostic : Si vous voyez cet écran, le code fonctionne !</p>

  <div class="card">
    <h2>Test de connexion Google Sheet</h2>
    <button onclick="chargerStock()">Charger le Stock</button>
    <div id="zone-affichage-stock" style="margin-top: 20px; text-align: left;">
      <p style="color: #666; text-align: center;">Cliquez sur le bouton ci-dessus pour tester.</p>
    </div>
  </div>

<script>
  const URL_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbxz5dZkT7FyFx8ohxWmg2Pt23Yqx0LQDMqqJg8LM8bkfN3ulkb37VqUO8m8WvjyuGBqrg/exec";

  function chargerStock() {
    const conteneur = document.getElementById("zone-affichage-stock");
    conteneur.innerHTML = "<p style='color: #0758a5; text-align:center;'>Connexion en cours avec le Google Sheet...</p>";

    const nomFonctionGlobal = "cb_" + Math.random().toString(36).substring(2, 9);
    
    window[nomFonctionGlobal] = function(reponse) {
      delete window[nomFonctionGlobal];
      const scriptElement = document.getElementById(nomFonctionGlobal);
      if (scriptElement) scriptElement.remove();
      
      if (reponse && reponse.success && Array.isArray(reponse.data)) {
        let html = "<table style='width:100%; border-collapse:collapse; font-size:14px;'>";
        html += "<tr style='background:#0758a5; color:#fff;'><th style='padding:8px;'>Produit</th><th style='padding:8px; text-align:center;'>Actuel</th><th style='padding:8px; text-align:center;'>Statut</th></tr>";
        
        reponse.data.forEach(item => {
          let couleurStatut = item.statut === 'OK' ? 'green' : 'red';
          html += `<tr style='border-bottom:1px solid #ddd;'>
            <td style='padding:8px;'>${item.produit || ''}</td>
            <td style='padding:8px; text-align:center; font-weight:bold;'>${item.actuel || 0}</td>
            <td style='padding:8px; text-align:center; color:${couleurStatut}; font-weight:bold;'>${item.statut || ''}</td>
          </tr>`;
        });
        html += "</table>";
        conteneur.innerHTML = html;
      } else {
        conteneur.innerHTML = "<p style='color:red; text-align:center;'>Erreur : Les données reçues sont invalides.</p>";
      }
    };

    const script = document.createElement('script');
    script.id = nomFonctionGlobal;
    script.src = `${URL_APPS_SCRIPT}?api=1&action=getStockData&callback=${nomFonctionGlobal}`;
    script.onerror = function() {
      conteneur.innerHTML = "<p style='color:red; text-align:center;'>Erreur de connexion au serveur Google Sheets (Vérifiez le déploiement Apps Script).</p>";
    };
    document.body.appendChild(script);
  }
</script>

</body>
</html>
