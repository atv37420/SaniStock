<body>
<div id="app">
  <!-- VOTRE APPLICATION EXISTANTE -->
  <div style="color:white; padding:20px; text-align:center;">
    <h1>SaniStock</h1>
    <p>Connexion en cours avec le Google Sheet...</p>
    <div id="zone-affichage-stock" style="margin-top:20px; text-align:left;"></div>
  </div>
</div>

<script>
  // Votre URL Google Apps Script officielle
  const URL_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbxz5dZkT7FyFx8ohxWmg2Pt23Yqx0LQDMqqJg8LM8bkfN3ulkb37VqUO8m8WvjyuGBqrg/exec";

  function chargerDonneesSaniStock() {
    fetch(URL_APPS_SCRIPT)
      .then(response => {
        if (!response.ok) {
          throw new Error("Erreur de connexion avec le Google Sheet");
        }
        return response.json();
      })
      .then(data => {
        console.log("Données du Sheet récupérées avec succès :", data);
        
        // Affichage simple des données du stock dans la page
        const conteneur = document.getElementById("zone-affichage-stock");
        if (conteneur && Array.isArray(data)) {
          let html = "<h3 style='color:#fff;'>Mon Stock Google Sheets :</h3><ul style='color:#fff;'>";
          data.forEach(ligne => {
            html += `<li>${ligne.join(" | ")}</li>`;
          });
          html += "</ul>";
          conteneur.innerHTML = html;
        }
      })
      .catch(error => {
        console.error("Impossible de charger les données :", error);
      });
  }

  // Lancer le chargement dès que la page s'ouvre
  window.addEventListener("DOMContentLoaded", () => {
    chargerDonneesSaniStock();
  });
</script>
